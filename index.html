<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rich Simpla Webbradio</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --active-channel: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: var(--accent);
    }

    .player-box {
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: center;
    }

    .current-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      min-height: 1.5em;
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
    }

    .section-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .channel-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .btn {
      background-color: #334155;
      color: var(--text-main);
      border: 2px solid transparent;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background-color: #475569;
    }

    .btn.active {
      border-color: var(--active-channel);
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--active-channel);
    }

    .custom-input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="url"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: var(--text-main);
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    input[type="url"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .play-custom-btn {
      background-color: var(--accent);
      color: #0f172a;
      width: 100%;
    }

    .play-custom-btn:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Rich Simpla Webbradio</h1>

  <div class="player-box">
    <div id="current-channel-display" class="current-title">Välj en kanal</div>
    <audio id="audio-player" controls autoplay preload="none"></audio>
  </div>

  <div class="section-title">Kanaler</div>
  <div class="channel-grid">
    <button class="btn" onclick="playChannel('P1', 'https://live1.sr.se/p1-aac-320', this)">P1</button>
    <button class="btn" onclick="playChannel('P2', 'https://live1.sr.se/p2-aac-320', this)">P2</button>
    <button class="btn" onclick="playChannel('P3', 'https://live1.sr.se/p3-aac-320', this)">P3</button>
    <button class="btn" onclick="playChannel('P4 Malmöhus', 'https://live1.sr.se/p4malm-aac-320', this)">P4</button>
    <button class="btn" onclick="playChannel('P4+', 'https://live1.sr.se/p4plus-aac-320', this)" style="grid-column: span 2;">P4+</button>
  </div>

  <div class="section-title">Egen Länk</div>
  <div class="custom-input-group">
    <input type="url" id="custom-url" placeholder="Klistra in stream-URL (t.ex. https://...)" />
    <button class="btn play-custom-btn" onclick="playCustomUrl()">Spela valfri stream</button>
  </div>
</div>

<script>
  const audioPlayer = document.getElementById('audio-player');
  const display = document.getElementById('current-channel-display');

  function playChannel(name, url, btnElement) {
    // Uppdatera audio-källa
    audioPlayer.src = url;
    audioPlayer.play();
    
    // Uppdatera text
    display.textContent = 'Spelar: ' + name;

    // Hantera aktiv knapp-markering
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    if (btnElement) {
      btnElement.classList.add('active');
    }
  }

  function playCustomUrl() {
    const customUrl = document.getElementById('custom-url').value.trim();
    if (customUrl) {
      playChannel('Egen stream', customUrl, null);
    } else {
      alert('Vänligen klistra in en giltig URL först.');
    }
  }
</script>

</body>
</html>
